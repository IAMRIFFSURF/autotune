name: Build SnapTune (Windows VST3)

on:
  push:
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -S . -B build -G "Visual Studio 17 2022" -A x64

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Collect
        shell: bash
        run: |
          mkdir -p dist
          cp -r build/SnapTune_artefacts/Release/VST3/SnapTune.vst3 dist/
          cp -r build/SnapTune_artefacts/Release/Standalone/SnapTune.exe dist/ || true

      - uses: actions/upload-artifact@v4
        with:
          name: SnapTune-Windows-VST3
          path: dist
