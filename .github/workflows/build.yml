name: Build SnapTune (Windows VST3)

on:
  push:
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -S . -B build

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Collect
        shell: bash
        run: |
          mkdir -p dist
          find build -name "SnapTune.vst3" -type d -exec cp -r {} dist/ \;
          find build -name "SnapTune.exe" -exec cp {} dist/ \;
          ls -R dist | head -40

      - uses: actions/upload-artifact@v4
        with:
          name: SnapTune-Windows-VST3
          path: dist
